    <script>
        // ==========================================
        // 1. SISTEM AUDIO SINTETIK & HAPTIC VIBRATION
        // ==========================================
        let audioCtx = null;
        let isAudioMuted = false;

        // Respon getar ramah sensori untuk smartphone
        function triggerHaptic(type = 'light') {
            if ('vibrate' in navigator) {
                try {
                    if (type === 'light') navigator.vibrate(15);
                    else if (type === 'success') navigator.vibrate([25, 45, 35]);
                    else if (type === 'error') navigator.vibrate(40);
                } catch (e) {}
            }
        }

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleAudio() {
            isAudioMuted = !isAudioMuted;
            const btn = document.getElementById('btn-sound');
            btn.innerHTML = isAudioMuted ? '🔇' : '🔊';
            btn.classList.toggle('bg-slate-400', isAudioMuted);
            btn.classList.toggle('bg-sky-400', !isAudioMuted);
        }

        // Suara Pop Gelembung
        function playPopSound() {
            triggerHaptic('light');
            if (isAudioMuted) return;
            initAudio();
            if (!audioCtx) return;

            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                const freq = 350 + Math.random() * 350;
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.8, now + 0.08);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.08);
            } catch (err) {
                console.warn('Audio error:', err);
            }
        }

        // Suara Notifikasi Sukses / Cocok
        function playSuccessChime() {
            triggerHaptic('success');
            if (isAudioMuted) return;
            initAudio();
            if (!audioCtx) return;

            try {
                const notes = [523.25, 659.25, 783.99, 1046.50]; // Do, Mi, Sol, Do tinggi
                notes.forEach((freq, idx) => {
                    const now = audioCtx.currentTime + (idx * 0.08);
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now);

                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(now);
                    osc.stop(now + 0.25);
                });
            } catch (err) {
                console.warn('Audio error:', err);
            }
        }

        // Suara Gagal / Salah yang Lembut (Boop)
        function playSoftBoop() {
            triggerHaptic('error');
            if (isAudioMuted) return;
            initAudio();
            if (!audioCtx) return;

            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(140, now + 0.15);

                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.15);
            } catch (err) {
                console.warn('Audio error:', err);
            }
        }

        // Suara Goyangan Menggambar (Chime lembut)
        let lastDrawSoundTime = 0;
        function playDrawChime() {
            const nowTime = Date.now();
            if (nowTime - lastDrawSoundTime < 90) return; // batasi frekuensi suara
            lastDrawSoundTime = nowTime;

            if (isAudioMuted) return;
            initAudio();
            if (!audioCtx) return;

            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                const scale = [440, 493.88, 554.37, 659.25, 739.99]; // Pentatonik
                const freq = scale[Math.floor(Math.random() * scale.length)];

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now);

                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.12);
            } catch (err) {
                console.warn('Audio error:', err);
            }
        }

        // Suara Efek Hewan Sintetik & Text-to-Speech
        function playAnimal(animalType, animalName, soundOnomatopoeia) {
            initAudio();
            playPopSound();
            triggerHaptic('light');

            // Bicara nama hewan dalam bahasa Indonesia menggunakan SpeechSynthesis
            if ('speechSynthesis' in window && !isAudioMuted) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(animalName + '! ' + soundOnomatopoeia);
                utterance.lang = 'id-ID';
                utterance.pitch = 1.3;
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }

            addStars(1);
        }

        // ==========================================
        // 2. MANAJEMEN SKOR & TAMPILAN
        // ==========================================
        let starCount = 0;
        function addStars(amount) {
            starCount += amount;
            const el = document.getElementById('star-count');
            el.innerText = starCount;
            el.classList.add('scale-125');
            setTimeout(() => el.classList.remove('scale-125'), 200);
        }

        const views = {
            menu: document.getElementById('view-menu'),
            bubbles: document.getElementById('view-bubbles'),
            animals: document.getElementById('view-animals'),
            drawing: document.getElementById('view-drawing'),
            matching: document.getElementById('view-matching')
        };
        const backBtn = document.getElementById('btn-back');
        const appTitle = document.getElementById('app-title');

        function openGame(gameKey) {
            initAudio();
            Object.values(views).forEach(v => v.classList.add('hidden'));

            if (views[gameKey]) {
                views[gameKey].classList.remove('hidden');
                backBtn.classList.remove('hidden');

                if (gameKey === 'bubbles') {
                    appTitle.innerHTML = '<span>🫧</span><span>Gelembung</span>';
                    startBubbleGame();
                } else if (gameKey === 'animals') {
                    appTitle.innerHTML = '<span>🦁</span><span>Suara Hewan</span>';
                    stopBubbleGame();
                } else if (gameKey === 'drawing') {
                    appTitle.innerHTML = '<span>🖍️</span><span>Papan Coret</span>';
                    stopBubbleGame();
                    initDrawingCanvas();
                } else if (gameKey === 'matching') {
                    appTitle.innerHTML = '<span>✏️</span><span>Tarik Garis</span>';
                    stopBubbleGame();
                    initMatchGame();
                }
            }
        }

        function goToMenu() {
            initAudio();
            stopBubbleGame();
            Object.values(views).forEach(v => v.classList.add('hidden'));
            views.menu.classList.remove('hidden');
            backBtn.classList.add('hidden');
            appTitle.innerHTML = '<span>🌈</span><span>Sensori Ceria</span>';
        }

        // ==========================================
        // 3. GAME 1: PECAH GELEMBUNG
        // ==========================================
        let bubbleInterval = null;
        const bubbleContainer = document.getElementById('bubble-container');
        const bubbleEmojis = ['⭐', '🌸', '🎈', '🍭', '🍓', '🐣', '🦋', '🐟'];
        const bubbleColors = [
            'from-pink-300 to-rose-400',
            'from-sky-300 to-blue-400',
            'from-amber-300 to-yellow-400',
            'from-emerald-300 to-teal-400',
            'from-purple-300 to-indigo-400'
        ];

        function startBubbleGame() {
            stopBubbleGame();
            bubbleContainer.innerHTML = '';
            // Buat gelembung awal
            for (let i = 0; i < 6; i++) {
                spawnBubble(true);
            }
            // Buat gelembung berkala
            bubbleInterval = setInterval(() => {
                if (bubbleContainer.children.length < 14) {
                    spawnBubble(false);
                }
            }, 900);
        }

        function stopBubbleGame() {
            if (bubbleInterval) {
                clearInterval(bubbleInterval);
                bubbleInterval = null;
            }
        }

        function spawnBubble(isInitial) {
            const bubble = document.createElement('div');
            // Ukuran adaptif terhadap lebar layar mobile
            const isSmallScreen = window.innerWidth < 640;
            const minSize = isSmallScreen ? 60 : 75;
            const maxSize = isSmallScreen ? 85 : 110;
            const size = Math.floor(Math.random() * (maxSize - minSize)) + minSize;

            const maxLeft = Math.max(10, window.innerWidth - size - 20);
            const left = Math.floor(Math.random() * (maxLeft - 10)) + 10;
            const duration = Math.floor(Math.random() * 3) + (isSmallScreen ? 5 : 6);
            const colorClass = bubbleColors[Math.floor(Math.random() * bubbleColors.length)];
            const emoji = bubbleEmojis[Math.floor(Math.random() * bubbleEmojis.length)];

            bubble.className = `bubble-item bg-gradient-to-tr ${colorClass} shadow-lg border-3 sm:border-4 border-white/85 flex items-center justify-center text-3xl sm:text-4xl`;
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.left = `${left}px`;
            bubble.style.animationDuration = `${duration}s`;
            if (isInitial) {
                bubble.style.bottom = `${Math.floor(Math.random() * 65)}%`;
            } else {
                bubble.style.bottom = '-110px';
            }
            bubble.innerHTML = emoji;

            // Sentuh untuk meletupkan
            const popHandler = (e) => {
                e.preventDefault();
                e.stopPropagation();
                playPopSound();
                addStars(1);
                bubble.classList.add('bubble-pop');
                const clientX = e.clientX || (e.touches && e.touches[0]?.clientX) || (bubble.offsetLeft + size / 2);
                const clientY = e.clientY || (e.touches && e.touches[0]?.clientY) || (bubble.offsetTop + size / 2);
                createSparkles(clientX, clientY);
                setTimeout(() => {
                    if (bubble.parentNode) bubble.remove();
                }, 180);
            };

            bubble.addEventListener('pointerdown', popHandler);

            // Bersihkan jika keluar batas atas
            bubble.addEventListener('animationend', () => {
                if (bubble.parentNode) bubble.remove();
            });

            bubbleContainer.appendChild(bubble);
        }

        function createSparkles(x, y) {
            for (let i = 0; i < 6; i++) {
                const s = document.createElement('div');
                s.className = 'confetti-piece text-xl';
                s.style.left = `${x + (Math.random() * 40 - 20)}px`;
                s.style.top = `${y + (Math.random() * 40 - 20)}px`;
                s.innerText = ['✨', '⭐', '💫'][Math.floor(Math.random() * 3)];
                document.body.appendChild(s);
                setTimeout(() => s.remove(), 800);
            }
        }

        // ==========================================
        // 4. GAME 2: PAPAN CORET SENSORIK (HIGH-DPI RETINA)
        // ==========================================
        const drawCanvas = document.getElementById('drawing-canvas');
        const drawCtx = drawCanvas.getContext('2d');
        let isDrawing = false;
        let currentColor = '#ef4444';
        let isRainbowMode = false;
        let rainbowHue = 0;
        let dpr = window.devicePixelRatio || 1;

        function initDrawingCanvas() {
            const rect = drawCanvas.parentElement.getBoundingClientRect();
            dpr = window.devicePixelRatio || 1;
            drawCanvas.width = rect.width * dpr;
            drawCanvas.height = rect.height * dpr;
            drawCtx.resetTransform ? drawCtx.resetTransform() : drawCtx.setTransform(1, 0, 0, 1, 0, 0);
            drawCtx.scale(dpr, dpr);
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';
            drawCtx.lineWidth = window.innerWidth < 640 ? 14 : 20;
        }

        function setDrawColor(color) {
            initAudio();
            playPopSound();
            if (color === 'rainbow') {
                isRainbowMode = true;
            } else {
                isRainbowMode = false;
                currentColor = color;
            }
        }

        function clearDrawingCanvas() {
            initAudio();
            playPopSound();
            drawCtx.clearRect(0, 0, drawCanvas.width / dpr, drawCanvas.height / dpr);
        }

        function getCanvasPos(e) {
            const rect = drawCanvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        drawCanvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            isDrawing = true;
            const pos = getCanvasPos(e);
            drawCtx.beginPath();
            drawCtx.moveTo(pos.x, pos.y);
            playDrawChime();
        });

        drawCanvas.addEventListener('pointermove', (e) => {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getCanvasPos(e);

            if (isRainbowMode) {
                rainbowHue = (rainbowHue + 4) % 360;
                drawCtx.strokeStyle = `hsl(${rainbowHue}, 90%, 55%)`;
            } else {
                drawCtx.strokeStyle = currentColor;
            }

            drawCtx.lineTo(pos.x, pos.y);
            drawCtx.stroke();
            playDrawChime();
        });

        window.addEventListener('pointerup', () => {
            if (isDrawing) {
                isDrawing = false;
                drawCtx.closePath();
            }
        });

        // ==========================================
        // 5. GAME 3: TARIK GARIS (MATCHING)
        // ==========================================
        const matchData = [
            { id: 'rabbit', leftEmoji: '🐰', leftText: 'Kelinci', rightEmoji: '🥕', rightText: 'Wortel', color: '#f97316' },
            { id: 'monkey', leftEmoji: '🐵', leftText: 'Monyet', rightEmoji: '🍌', rightText: 'Pisang', color: '#eab308' },
            { id: 'cat', leftEmoji: '🐱', leftText: 'Kucing', rightEmoji: '🐟', rightText: 'Ikan', color: '#06b6d4' },
            { id: 'mouse', leftEmoji: '🐭', leftText: 'Tikus', rightEmoji: '🧀', rightText: 'Keju', color: '#8b5cf6' }
        ];

        let completedPairs = [];
        let activeDrag = null;

        const matchCanvas = document.getElementById('match-canvas');
        const matchCtx = matchCanvas.getContext('2d');
        const colLeft = document.getElementById('col-left');
        const colRight = document.getElementById('col-right');
        const modalCelebrate = document.getElementById('modal-celebrate');

        function initMatchGame() {
            completedPairs = [];
            activeDrag = null;
            modalCelebrate.classList.add('hidden');

            colLeft.innerHTML = '';
            colRight.innerHTML = '';

            // Sisi Kiri (Hewan)
            matchData.forEach(item => {
                const el = createMatchButton(item.id, 'left', item.leftEmoji, item.leftText, item.color);
                colLeft.appendChild(el);
            });

            // Sisi Kanan (Makanan) - Diacak urutannya
            const shuffledFoods = [...matchData].sort(() => Math.random() - 0.5);
            shuffledFoods.forEach(item => {
                const el = createMatchButton(item.id, 'right', item.rightEmoji, item.rightText, item.color);
                colRight.appendChild(el);
            });

            setTimeout(() => {
                resizeMatchCanvas();
                renderMatchLines();
            }, 60);
        }

        function createMatchButton(id, side, emoji, text, color) {
            const btn = document.createElement('div');
            btn.dataset.id = id;
            btn.dataset.side = side;
            btn.dataset.color = color;
            // Ukuran adaptif: tetap nyaman disentuh jari mungil balita
            btn.className = 'w-16 h-16 sm:w-24 sm:h-24 md:w-28 md:h-28 bg-white rounded-2xl sm:rounded-3xl flex flex-col items-center justify-center border-3 sm:border-4 border-slate-200 shadow-md sm:shadow-lg cursor-pointer touch-none select-none active:scale-95 transition-transform';
            btn.innerHTML = `
                <span class="text-3xl sm:text-5xl pointer-events-none">${emoji}</span>
                <span class="text-[10px] sm:text-sm font-black text-slate-700 pointer-events-none mt-0.5 leading-none">${text}</span>
            `;

            btn.addEventListener('pointerdown', (e) => {
                // Jangan tarik jika sudah berhasil dipasangkan
                if (completedPairs.some(p => p.id === id)) return;

                e.preventDefault();
                initAudio();
                playPopSound();

                btn.style.borderColor = color;
                btn.classList.add('scale-105');

                activeDrag = {
                    id: id,
                    side: side,
                    color: color,
                    startElement: btn,
                    currX: e.clientX,
                    currY: e.clientY
                };

                renderMatchLines();
            });

            return btn;
        }

        function getCenterCoords(el) {
            const rect = el.getBoundingClientRect();
            const canvasRect = matchCanvas.getBoundingClientRect();
            return {
                x: (rect.left + rect.width / 2) - canvasRect.left,
                y: (rect.top + rect.height / 2) - canvasRect.top
            };
        }

        function renderMatchLines() {
            if (!matchCanvas.width) return;
            const matchDpr = window.devicePixelRatio || 1;
            matchCtx.clearRect(0, 0, matchCanvas.width / matchDpr, matchCanvas.height / matchDpr);
            matchCtx.lineCap = 'round';
            matchCtx.lineWidth = window.innerWidth < 640 ? 9 : 14;

            // 1. Gambar semua garis yang sudah terkunci/selesai
            completedPairs.forEach(pair => {
                const leftPos = getCenterCoords(pair.leftEl);
                const rightPos = getCenterCoords(pair.rightEl);

                matchCtx.strokeStyle = pair.color;
                matchCtx.beginPath();
                matchCtx.moveTo(leftPos.x, leftPos.y);
                matchCtx.lineTo(rightPos.x, rightPos.y);
                matchCtx.stroke();
            });

            // 2. Gambar garis aktif yang sedang ditarik
            if (activeDrag) {
                const startPos = getCenterCoords(activeDrag.startElement);
                const canvasRect = matchCanvas.getBoundingClientRect();
                const targetX = activeDrag.currX - canvasRect.left;
                const targetY = activeDrag.currY - canvasRect.top;

                matchCtx.strokeStyle = activeDrag.color;
                matchCtx.beginPath();
                matchCtx.moveTo(startPos.x, startPos.y);
                matchCtx.lineTo(targetX, targetY);
                matchCtx.stroke();
            }
        }

        // Penanganan Tarikan (Drag) Garis
        window.addEventListener('pointermove', (e) => {
            if (!activeDrag) return;
            activeDrag.currX = e.clientX;
            activeDrag.currY = e.clientY;
            renderMatchLines();
        });

        // Penanganan Lepas Sentuhan dengan Toleransi Magnetik untuk Balita
        window.addEventListener('pointerup', (e) => {
            if (!activeDrag) return;

            activeDrag.startElement.classList.remove('scale-105');

            // Deteksi elemen langsung di bawah jari
            let targetElement = document.elementFromPoint(e.clientX, e.clientY);
            let dropCard = targetElement ? targetElement.closest('[data-side]') : null;

            // FITUR RAMAH BALITA: Jika jari terlepas sedikit di luar tombol (jarak 45px), temukan kartu terdekat
            if (!dropCard) {
                const targetSide = activeDrag.side === 'left' ? 'right' : 'left';
                const potentialCards = document.querySelectorAll(`[data-side="${targetSide}"]`);
                let closestDist = Infinity;
                let candidate = null;

                potentialCards.forEach(card => {
                    const rect = card.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;
                    const dist = Math.hypot(e.clientX - centerX, e.clientY - centerY);
                    // Radius tangkap toleran hingga 55px
                    if (dist < closestDist && dist < 55) {
                        closestDist = dist;
                        candidate = card;
                    }
                });

                if (candidate) {
                    dropCard = candidate;
                }
            }

            if (dropCard) {
                const targetId = dropCard.dataset.id;
                const targetSide = dropCard.dataset.side;

                // Validasi: ID harus cocok dan dari sisi yang berlawanan
                if (targetId === activeDrag.id && targetSide !== activeDrag.side) {
                    // BERHASIL COCOK!
                    playSuccessChime();
                    addStars(2);

                    dropCard.style.borderColor = activeDrag.color;
                    activeDrag.startElement.style.borderColor = activeDrag.color;
                    dropCard.classList.add('bg-amber-50');
                    activeDrag.startElement.classList.add('bg-amber-50');

                    completedPairs.push({
                        id: activeDrag.id,
                        color: activeDrag.color,
                        leftEl: activeDrag.side === 'left' ? activeDrag.startElement : dropCard,
                        rightEl: activeDrag.side === 'right' ? activeDrag.startElement : dropCard
                    });

                    // Cek Apakah Semua Selesai
                    if (completedPairs.length === matchData.length) {
                        setTimeout(() => {
                            playSuccessChime();
                            modalCelebrate.classList.remove('hidden');
                        }, 350);
                    }
                } else {
                    // Salah pasangan
                    playSoftBoop();
                    if (!completedPairs.some(p => p.id === activeDrag.id)) {
                        activeDrag.startElement.style.borderColor = '#e2e8f0';
                    }
                }
            } else {
                // Dilepas di luar target
                if (!completedPairs.some(p => p.id === activeDrag.id)) {
                    activeDrag.startElement.style.borderColor = '#e2e8f0';
                }
            }

            activeDrag = null;
            renderMatchLines();
        });

        function resizeMatchCanvas() {
            const rect = matchCanvas.parentElement.getBoundingClientRect();
            const matchDpr = window.devicePixelRatio || 1;
            matchCanvas.width = rect.width * matchDpr;
            matchCanvas.height = rect.height * matchDpr;
            matchCtx.resetTransform ? matchCtx.resetTransform() : matchCtx.setTransform(1, 0, 0, 1, 0, 0);
            matchCtx.scale(matchDpr, matchDpr);
            renderMatchLines();
        }

        // ==========================================
        // 6. EVENT RESIZE & ORIENTATION GLOBAL
        // ==========================================
        window.addEventListener('resize', () => {
            if (!views.drawing.classList.contains('hidden')) {
                initDrawingCanvas();
            }
            if (!views.matching.classList.contains('hidden')) {
                resizeMatchCanvas();
            }
        });
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                if (!views.drawing.classList.contains('hidden')) initDrawingCanvas();
                if (!views.matching.classList.contains('hidden')) resizeMatchCanvas();
            }, 150);
        });

        // Inisialisasi awal saat halaman dimuat
        window.addEventListener('DOMContentLoaded', () => {
            window.addEventListener('pointerdown', () => initAudio(), { once: true });
        });
    </script>
</body>
