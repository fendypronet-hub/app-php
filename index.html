<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bermain & Belajar - Interaktif Anak</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            touch-action: none; /* Mencegah pull-to-refresh dan scroll tidak sengaja */
            -webkit-user-select: none;
            user-select: none;
            overflow: hidden;
            background-color: #f0f9ff;
        }

        /* Animasi Tombol Menu */
        .btn-bounce {
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s;
        }
        .btn-bounce:active {
            transform: scale(0.95);
        }

        /* Animasi Gelembung */
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.4) 40%, rgba(255, 255, 255, 0.1) 100%);
            box-shadow: inset 0 0 20px rgba(255,255,255,0.5), 0 0 10px rgba(0,0,0,0.1);
            animation: floatUp 3s ease-in-out forwards;
            pointer-events: none;
            transform: translate(-50%, -50%);
        }
        @keyframes floatUp {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            20% { transform: translate(-50%, calc(-50% - 50px)) scale(1.2); }
            80% { opacity: 0.8; }
            100% { transform: translate(-50%, calc(-50% - 300px)) scale(1.5); opacity: 0; }
        }

        /* Animasi Kartu Hewan */
        .animal-card {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .animal-card.active {
            transform: scale(1.1) rotate(5deg);
        }
        .speech-bubble {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 1.5rem;
            font-weight: 900;
            color: #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            opacity: 0;
            transition: opacity 0.2s, top 0.2s;
            pointer-events: none;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: white transparent transparent transparent;
        }
        .animal-card.active .speech-bubble {
            opacity: 1;
            top: -60px;
        }

        /* Canvas Papan Gambar */
        #draw-canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
    </style>
</head>
<body class="w-screen h-screen">

    <!-- AUDIO CONTEXT HELPER -->
    <script>
        // Inisialisasi Audio Context untuk menghasilkan suara sederhana tanpa file eksternal
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playPopSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playAnimalSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            gainNode.connect(audioCtx.destination);
            osc.connect(gainNode);

            const now = audioCtx.currentTime;
            
            if (type === 'kucing') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.4);
                gainNode.gain.setValueAtTime(0.5, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'anjing') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(300, now);
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.3, now + 0.05);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'sapi') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.linearRampToValueAtTime(150, now + 0.8);
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.4, now + 0.2);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.8);
                osc.start(now);
                osc.stop(now + 0.8);
            } else if (type === 'bebek') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.linearRampToValueAtTime(300, now + 0.2);
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.4, now + 0.05);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }
    </script>

    <!-- MENU UTAMA -->
    <div id="main-menu" class="absolute inset-0 flex flex-col items-center justify-center bg-yellow-50 z-50">
        <h1 class="text-4xl md:text-6xl font-black text-center text-pink-500 mb-2 drop-shadow-md">Ayo Bermain!</h1>
        <p class="text-xl md:text-2xl text-gray-600 mb-8 font-bold">Pilih permainan seru di bawah ini</p>
        
        <div class="flex flex-col md:flex-row gap-6 w-full max-w-4xl px-4">
            <!-- Tombol Gelembung -->
            <button onclick="startGame('bubbles')" class="btn-bounce flex-1 bg-cyan-400 hover:bg-cyan-500 text-white rounded-3xl p-6 shadow-[0_8px_0_rgb(6,182,212)] flex flex-col items-center justify-center border-4 border-white">
                <span class="text-7xl mb-2">🫧</span>
                <span class="text-2xl md:text-3xl font-black">Gelembung<br>Warna</span>
            </button>

            <!-- Tombol Hewan -->
            <button onclick="startGame('animals')" class="btn-bounce flex-1 bg-green-400 hover:bg-green-500 text-white rounded-3xl p-6 shadow-[0_8px_0_rgb(34,197,94)] flex flex-col items-center justify-center border-4 border-white">
                <span class="text-7xl mb-2">🐶</span>
                <span class="text-2xl md:text-3xl font-black">Suara<br>Hewan</span>
            </button>

            <!-- Tombol Gambar -->
            <button onclick="startGame('draw')" class="btn-bounce flex-1 bg-purple-400 hover:bg-purple-500 text-white rounded-3xl p-6 shadow-[0_8px_0_rgb(168,85,247)] flex flex-col items-center justify-center border-4 border-white">
                <span class="text-7xl mb-2">🎨</span>
                <span class="text-2xl md:text-3xl font-black">Papan<br>Gambar</span>
            </button>
        </div>
    </div>

    <!-- TOMBOL KEMBALI (Global untuk semua game) -->
    <button id="back-btn" onclick="showMenu()" class="hidden absolute top-4 left-4 z-[100] btn-bounce bg-red-400 text-white px-6 py-3 rounded-full text-xl font-bold shadow-[0_6px_0_rgb(248,113,113)] border-4 border-white">
        ⬅ Kembali
    </button>

    <!-- GAME 1: GELEMBUNG WARNA -->
    <div id="game-bubbles" class="hidden absolute inset-0 bg-cyan-100 overflow-hidden" onpointerdown="createBubble(event)">
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-30">
            <h2 class="text-4xl md:text-6xl text-cyan-600 font-black text-center px-4">Sentuh layar untuk membuat gelembung!</h2>
        </div>
        <div id="bubble-container"></div>
    </div>

    <!-- GAME 2: SUARA HEWAN -->
    <div id="game-animals" class="hidden absolute inset-0 bg-green-50 flex items-center justify-center p-4">
        <div class="grid grid-cols-2 gap-4 md:gap-8 w-full max-w-2xl mt-16">
            <div class="animal-card bg-orange-300 rounded-3xl p-4 md:p-8 shadow-xl flex flex-col items-center justify-center border-4 border-white relative" onpointerdown="triggerAnimal(this, 'kucing', 'Meong!')">
                <div class="speech-bubble text-orange-600"></div>
                <span class="text-8xl md:text-9xl filter drop-shadow-md">🐱</span>
                <span class="mt-4 text-3xl md:text-4xl font-black text-white drop-shadow-md">Kucing</span>
            </div>
            
            <div class="animal-card bg-blue-300 rounded-3xl p-4 md:p-8 shadow-xl flex flex-col items-center justify-center border-4 border-white relative" onpointerdown="triggerAnimal(this, 'anjing', 'Guk Guk!')">
                <div class="speech-bubble text-blue-600"></div>
                <span class="text-8xl md:text-9xl filter drop-shadow-md">🐶</span>
                <span class="mt-4 text-3xl md:text-4xl font-black text-white drop-shadow-md">Anjing</span>
            </div>

            <div class="animal-card bg-pink-300 rounded-3xl p-4 md:p-8 shadow-xl flex flex-col items-center justify-center border-4 border-white relative" onpointerdown="triggerAnimal(this, 'sapi', 'Moo!')">
                <div class="speech-bubble text-pink-600"></div>
                <span class="text-8xl md:text-9xl filter drop-shadow-md">🐮</span>
                <span class="mt-4 text-3xl md:text-4xl font-black text-white drop-shadow-md">Sapi</span>
            </div>

            <div class="animal-card bg-yellow-400 rounded-3xl p-4 md:p-8 shadow-xl flex flex-col items-center justify-center border-4 border-white relative" onpointerdown="triggerAnimal(this, 'bebek', 'Kwek!')">
                <div class="speech-bubble text-yellow-700"></div>
                <span class="text-8xl md:text-9xl filter drop-shadow-md">🦆</span>
                <span class="mt-4 text-3xl md:text-4xl font-black text-white drop-shadow-md">Bebek</span>
            </div>
        </div>
    </div>

    <!-- GAME 3: PAPAN GAMBAR -->
    <div id="game-draw" class="hidden absolute inset-0 bg-white">
        <button onclick="clearCanvas()" class="absolute top-4 right-4 z-[100] btn-bounce bg-yellow-400 text-yellow-900 px-6 py-3 rounded-full text-xl font-bold shadow-[0_6px_0_rgb(250,204,21)] border-4 border-white">
            🗑 Hapus
        </button>
        <div class="absolute top-4 left-0 right-0 flex justify-center pointer-events-none z-[90]">
            <span class="bg-white/80 px-4 py-1 rounded-full text-gray-500 font-bold">Usap layar untuk menggambar</span>
        </div>
        <canvas id="draw-canvas"></canvas>
    </div>

    <!-- LOGIC APLIKASI -->
    <script>
        // Manajemen Tampilan
        const views = {
            menu: document.getElementById('main-menu'),
            bubbles: document.getElementById('game-bubbles'),
            animals: document.getElementById('game-animals'),
            draw: document.getElementById('game-draw')
        };
        const backBtn = document.getElementById('back-btn');

        function hideAllViews() {
            Object.values(views).forEach(v => v.classList.add('hidden'));
        }

        function startGame(gameName) {
            initAudio(); // Meminta izin audio context dari browser
            hideAllViews();
            views[gameName].classList.remove('hidden');
            backBtn.classList.remove('hidden');

            if (gameName === 'draw') {
                setupCanvas();
            }
        }

        function showMenu() {
            hideAllViews();
            views.menu.classList.remove('hidden');
            backBtn.classList.add('hidden');
        }

        // --- LOGIKA GAME 1: GELEMBUNG ---
        const bubbleContainer = document.getElementById('bubble-container');
        const colors = ['#f87171', '#fbbf24', '#34d399', '#60a5fa', '#a78bfa', '#f472b6'];

        function createBubble(e) {
            // Mainkan suara pop
            playPopSound();

            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            
            // Posisi
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            bubble.style.left = `${x}px`;
            bubble.style.top = `${y}px`;

            // Ukuran dan Warna acak
            const size = Math.floor(Math.random() * 60) + 60; // 60px - 120px
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            
            const color = colors[Math.floor(Math.random() * colors.length)];
            bubble.style.backgroundColor = color;
            bubble.style.border = `4px solid ${color}`;

            bubbleContainer.appendChild(bubble);

            // Hapus elemen setelah animasi selesai
            setTimeout(() => {
                if(bubble.parentNode) bubble.remove();
            }, 3000);
        }

        // --- LOGIKA GAME 2: HEWAN ---
        function triggerAnimal(element, type, soundText) {
            initAudio();
            
            // Set text
            const bubble = element.querySelector('.speech-bubble');
            bubble.textContent = soundText;
            
            // Animasi & Suara
            element.classList.add('active');
            playAnimalSound(type);

            // Hilangkan efek setelah beberapa saat
            setTimeout(() => {
                element.classList.remove('active');
            }, 800);
        }

        // --- LOGIKA GAME 3: MENGGAMBAR ---
        const canvas = document.getElementById('draw-canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let currentColor = '#000000';

        function setupCanvas() {
            // Sesuaikan ukuran dengan layar
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 15; // Ketebalan garis cocok untuk jari anak
        }

        function getRandomColor() {
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function startPosition(e) {
            isDrawing = true;
            currentColor = getRandomColor();
            ctx.strokeStyle = currentColor;
            draw(e);
        }

        function endPosition() {
            isDrawing = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault(); // Mencegah scrolling saat menggambar di HP

            let clientX, clientY;
            
            // Mendukung Mouse dan Touch
            if (e.type.includes('mouse')) {
                clientX = e.clientX;
                clientY = e.clientY;
            } else if (e.type.includes('touch')) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            // Dapatkan posisi relatif terhadap canvas
            const rect = canvas.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // Event Listener Canvas (Mouse)
        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseleave', endPosition);

        // Event Listener Canvas (Touch)
        canvas.addEventListener('touchstart', startPosition, {passive: false});
        canvas.addEventListener('touchend', endPosition);
        canvas.addEventListener('touchmove', draw, {passive: false});

        // Tangani perubahan ukuran jendela (resize)
        window.addEventListener('resize', () => {
            if (!views.draw.classList.contains('hidden')) {
                // Simpan gambar lama
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                tempCtx.drawImage(canvas, 0, 0);

                // Resize
                setupCanvas();

                // Kembalikan gambar lama (meski mungkin terpotong)
                ctx.drawImage(tempCanvas, 0, 0);
            }
        });
    </script>
</body>
</html>
